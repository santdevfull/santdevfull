name: Publish portfolio demos (manual activation required)
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd projects/habitflow && npm test
      - run: cd projects/budgetlab && npm test
      - run: node --check projects/portfolio.js && node --check projects/portfolio-data.mjs && node --test projects/portfolio.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/pulseops/requirements.txt
      - run: cd projects/pulseops && python -m pytest -q tests
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p dist/habitflow dist/budgetlab dist/pulseops/demo
          cp projects/habitflow/{index.html,app.mjs,model.mjs,style.css} dist/habitflow/
          for name in focusforge chromacheck notevault typemeter sprintboard studyloop invoicekit datalens; do
            mkdir -p dist/$name
            cp projects/$name/{index.html,app.mjs,domain.mjs,styles.css} dist/$name/
          done
          cp projects/budgetlab/{index.html,app.mjs,model.mjs,style.css} dist/budgetlab/
          cp -R projects/pulseops/demo/. dist/pulseops/demo/
          for name in flagpilot queuecraft ledgerforge eventshield; do
            mkdir -p dist/$name
            cp -R projects/$name/docs/. dist/$name/
          done
          cp projects/index.html dist/index.html
          cp projects/portfolio.css projects/portfolio.js projects/portfolio-motion.js projects/portfolio-data.mjs projects/favicon.svg projects/robots.txt projects/sitemap.xml dist/
          mkdir -p dist/media
          cp projects/media/signal-flow.webm projects/media/signal-flow-poster.webp dist/media/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
