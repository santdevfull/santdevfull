name: Validate GitHub profile

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/profile-hero.svg'
      - 'assets/avatar-santdev.svg'
      - 'assets/avatar-santdev.png'
      - 'assets/nivia-systems.svg'
      - 'docs/PROFILE_EN.md'
      - 'docs/github-profile-design.md'
      - 'scripts/verify_profile.py'
      - '.github/workflows/profile-readme.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'assets/profile-hero.svg'
      - 'assets/avatar-santdev.svg'
      - 'assets/avatar-santdev.png'
      - 'assets/nivia-systems.svg'
      - 'docs/PROFILE_EN.md'
      - 'docs/github-profile-design.md'
      - 'scripts/verify_profile.py'
      - '.github/workflows/profile-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Editorial content, links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_profile.py
