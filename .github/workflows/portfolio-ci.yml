name: All portfolio tests
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-ci.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend - ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [habitflow, budgetlab, focusforge, chromacheck, notevault, typemeter, sprintboard, studyloop, invoicekit, datalens]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  backend:
    name: Backend - ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [pulseops, flagpilot, queuecraft, ledgerforge, eventshield]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q tests
