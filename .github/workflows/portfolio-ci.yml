name: Portfolio CI
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-ci.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: JavaScript checks
    strategy:
      matrix:
        project: [habitflow, budgetlab]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.mjs && node --check model.mjs && node --check test.mjs
      - run: npm test
  api:
    name: FastAPI integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/pulseops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/pulseops/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q tests
      - run: docker build -t pulseops:ci .
